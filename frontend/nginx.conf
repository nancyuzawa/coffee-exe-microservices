server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Resolução por requisição: o frontend inicia mesmo se uma API estiver fora.
    location /api/catalogo/ {
        set $produtos ms-produtos:3001;
        rewrite ^/api/catalogo/(.*)$ /$1 break;
        proxy_pass http://$produtos;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/compras/ {
        set $pedidos ms-pedidos:3002;
        rewrite ^/api/compras/(.*)$ /$1 break;
        proxy_pass http://$pedidos;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/opinioes/ {
        set $avaliacoes ms-avaliacoes:3003;
        rewrite ^/api/opinioes/(.*)$ /$1 break;
        proxy_pass http://$avaliacoes;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/consulta/ {
        set $consulta ms-query:3004;
        rewrite ^/api/consulta/(.*)$ /$1 break;
        proxy_pass http://$consulta;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/eventos/ {
        set $eventos event-bus:4005;
        rewrite ^/api/eventos/(.*)$ /$1 break;
        proxy_pass http://$eventos;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"service":"frontend","status":"UP"}';
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
